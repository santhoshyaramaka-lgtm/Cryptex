<svg xmlns="http://www.w3.org/2000/svg" width="320" height="580" viewBox="0 0 320 580">
  <defs>
    <radialGradient id="door" cx="44" cy="44" r="37" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#546E7A"/>
      <stop offset="0.6" stop-color="#37474F"/>
      <stop offset="1"   stop-color="#263238"/>
    </radialGradient>
    <linearGradient id="chrome" gradientUnits="userSpaceOnUse" x1="14" y1="12" x2="68" y2="76">
      <stop offset="0"    stop-color="#707070"/>
      <stop offset="0.35" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#D0D0D0"/>
      <stop offset="1"    stop-color="#888888"/>
    </linearGradient>
    <!-- Pin button circle -->
    <radialGradient id="btnBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#2A3140"/>
      <stop offset="100%" stop-color="#1C2128"/>
    </radialGradient>
  </defs>

  <!-- Phone frame -->
  <rect x="10" y="10" width="300" height="560" rx="36" fill="#0D1117" stroke="#2A3140" stroke-width="2"/>

  <!-- Status bar -->
  <text x="30" y="38" font-family="sans-serif" font-size="11" fill="#80FFFFFF">9:41</text>
  <text x="270" y="38" text-anchor="end" font-family="sans-serif" font-size="11" fill="#80FFFFFF">●●●</text>

  <!-- ── APP ICON 88dp ── centred at x=160, top of upper zone -->
  <!-- Icon tile -->
  <rect x="116" y="56" width="88" height="88" rx="20" fill="#D8DCDF"/>
  <!-- Vault ring -->
  <circle cx="160" cy="100" r="34" fill="#37474F"/>
  <circle cx="160" cy="100" r="34" fill="none" stroke="#00BCD4" stroke-width="4.7" opacity="0.20"/>
  <circle cx="160" cy="100" r="34" fill="none" stroke="#00BCD4" stroke-width="2.6"/>
  <!-- Door face -->
  <circle cx="160" cy="100" r="29.3" fill="url(#door)"/>
  <!-- Inner ring -->
  <circle cx="160" cy="100" r="22.9" fill="none" stroke="#00E5FF" stroke-width="3.3" opacity="0.15"/>
  <circle cx="160" cy="100" r="22.9" fill="none" stroke="#00ACC1" stroke-width="1.9"/>
  <!-- Keyhole at C gap -->
  <circle cx="182" cy="102" r="3.5" fill="none" stroke="white" stroke-width="1.8"/>
  <rect x="180.7" y="102" width="2.6" height="5.6" rx="0.8" fill="white"/>
  <!-- Bolts -->
  <circle cx="160" cy="66.1" r="3.3" fill="#FFD700" stroke="#FF8F00" stroke-width="0.8"/>
  <circle cx="160" cy="133.9" r="3.3" fill="#FFD700" stroke="#FF8F00" stroke-width="0.8"/>
  <circle cx="126.1" cy="100" r="3.3" fill="#FFD700" stroke="#FF8F00" stroke-width="0.8"/>
  <circle cx="193.9" cy="100" r="3.3" fill="#FFD700" stroke="#FF8F00" stroke-width="0.8"/>
  <!-- Chrome C scaled to icon: viewport 1024->88px, scale=88/1024=0.0859, offset cx=(160-512*0.0859)=116.0, cy=(100-512*0.0859)=56.0 -->
  <g transform="scale(0.0859) translate(1350.8 651.9)">
    <path fill="rgba(0,0,0,0.13)" transform="translate(10,10)"
      d="M526.6,698.1 Q487.7,698.1 453.9,685.6 Q420.0,673.0 394.8,649.1 Q370.2,625.7 356.0,591.2 Q341.8,556.7 341.8,515.4 Q341.8,474.3 356.1,439.3 Q370.4,404.3 396.3,378.7 Q421.7,353.5 457.3,339.7 Q493.0,325.9 533.5,325.9 Q562.9,325.9 587.1,333.0 Q611.2,340.1 627.9,349.0 L643.3,335.3 L665.0,335.3 L667.3,464.3 L645.3,464.3 Q626.7,405.3 600.5,377.7 Q574.4,350.0 536.8,350.0 Q490.0,350.0 465.6,391.2 Q441.2,432.4 441.2,506.9 Q441.2,549.0 449.5,578.7 Q457.8,608.5 471.3,626.7 Q485.7,645.6 505.4,654.4 Q525.1,663.3 549.0,663.3 Q583.8,663.3 611.1,644.3 Q638.4,625.4 660.8,587.1 L682.2,600.0 Q671.5,621.9 657.8,639.2 Q644.1,656.5 626.2,669.0 Q606.5,682.7 582.7,690.4 Q558.9,698.1 526.6,698.1 Z"/>
    <path fill="url(#chrome)"
      d="M526.6,698.1 Q487.7,698.1 453.9,685.6 Q420.0,673.0 394.8,649.1 Q370.2,625.7 356.0,591.2 Q341.8,556.7 341.8,515.4 Q341.8,474.3 356.1,439.3 Q370.4,404.3 396.3,378.7 Q421.7,353.5 457.3,339.7 Q493.0,325.9 533.5,325.9 Q562.9,325.9 587.1,333.0 Q611.2,340.1 627.9,349.0 L643.3,335.3 L665.0,335.3 L667.3,464.3 L645.3,464.3 Q626.7,405.3 600.5,377.7 Q574.4,350.0 536.8,350.0 Q490.0,350.0 465.6,391.2 Q441.2,432.4 441.2,506.9 Q441.2,549.0 449.5,578.7 Q457.8,608.5 471.3,626.7 Q485.7,645.6 505.4,654.4 Q525.1,663.3 549.0,663.3 Q583.8,663.3 611.1,644.3 Q638.4,625.4 660.8,587.1 L682.2,600.0 Q671.5,621.9 657.8,639.2 Q644.1,656.5 626.2,669.0 Q606.5,682.7 582.7,690.4 Q558.9,698.1 526.6,698.1 Z"/>
  </g>

  <!-- "Enter PIN" title -->
  <text x="160" y="168" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#FFFFFF" letter-spacing="1">Enter PIN</text>

  <!-- PIN dots (4, empty) -->
  <circle cx="120" cy="200" r="11" fill="#3A3F47"/>
  <circle cx="148" cy="200" r="11" fill="#3A3F47"/>
  <circle cx="176" cy="200" r="11" fill="#3A3F47"/>
  <circle cx="204" cy="200" r="11" fill="#3A3F47"/>

  <!-- Number pad -->
  <!-- Row 1: 1 2 3 -->
  <circle cx="100" cy="275" r="36" fill="url(#btnBg)"/>
  <text x="100" y="281" text-anchor="middle" font-family="sans-serif-light" font-size="24" fill="#FFFFFF">1</text>
  <circle cx="160" cy="275" r="36" fill="url(#btnBg)"/>
  <text x="160" y="281" text-anchor="middle" font-family="sans-serif-light" font-size="24" fill="#FFFFFF">2</text>
  <circle cx="220" cy="275" r="36" fill="url(#btnBg)"/>
  <text x="220" y="281" text-anchor="middle" font-family="sans-serif-light" font-size="24" fill="#FFFFFF">3</text>

  <!-- Row 2: 4 5 6 -->
  <circle cx="100" cy="355" r="36" fill="url(#btnBg)"/>
  <text x="100" y="361" text-anchor="middle" font-family="sans-serif-light" font-size="24" fill="#FFFFFF">4</text>
  <circle cx="160" cy="355" r="36" fill="url(#btnBg)"/>
  <text x="160" y="361" text-anchor="middle" font-family="sans-serif-light" font-size="24" fill="#FFFFFF">5</text>
  <circle cx="220" cy="355" r="36" fill="url(#btnBg)"/>
  <text x="220" y="361" text-anchor="middle" font-family="sans-serif-light" font-size="24" fill="#FFFFFF">6</text>

  <!-- Row 3: 7 8 9 -->
  <circle cx="100" cy="435" r="36" fill="url(#btnBg)"/>
  <text x="100" y="441" text-anchor="middle" font-family="sans-serif-light" font-size="24" fill="#FFFFFF">7</text>
  <circle cx="160" cy="435" r="36" fill="url(#btnBg)"/>
  <text x="160" y="441" text-anchor="middle" font-family="sans-serif-light" font-size="24" fill="#FFFFFF">8</text>
  <circle cx="220" cy="435" r="36" fill="url(#btnBg)"/>
  <text x="220" y="441" text-anchor="middle" font-family="sans-serif-light" font-size="24" fill="#FFFFFF">9</text>

  <!-- Row 4: blank 0 backspace -->
  <circle cx="160" cy="515" r="36" fill="url(#btnBg)"/>
  <text x="160" y="521" text-anchor="middle" font-family="sans-serif-light" font-size="24" fill="#FFFFFF">0</text>
  <!-- Backspace symbol -->
  <text x="220" y="521" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#AAAAAA">⌫</text>

</svg>
